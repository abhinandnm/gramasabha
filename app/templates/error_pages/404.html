<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GramaSabha | Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }
        .glow-orb-1 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.1), transparent 70%);
            top: 10%; left: 15%;
        }
        .glow-orb-2 {
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08), transparent 70%);
            bottom: 10%; right: 15%;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: #161b27;
            border-radius: 28px;
            padding: 52px 44px;
            box-shadow:
                16px 16px 36px rgba(0, 0, 0, 0.5),
                -8px -8px 24px rgba(255, 255, 255, 0.03),
                inset 1px 1px 1px rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-code {
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fb7185, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .icon-wrap {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: rgba(244, 63, 94, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fb7185;
            box-shadow:
                6px 6px 14px rgba(0, 0, 0, 0.4),
                -3px -3px 8px rgba(255, 255, 255, 0.04);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        p {
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.7;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 600;
            margin-top: 6px;
            box-shadow:
                6px 6px 16px rgba(0, 0, 0, 0.4),
                0 4px 16px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow:
                6px 6px 20px rgba(0, 0, 0, 0.5),
                0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        .footer {
            font-size: 0.78rem;
            color: #334155;
        }
    </style>
</head>

<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="card">
        <div class="error-code">404</div>

        <div class="icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>

        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>

        <a href="/" class="btn-home">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            Back to Home
        </a>

        <div class="divider"></div>
        <span class="footer">GramaSabha &mdash; Real-Time Stranger Chat</span>
    </div>
</body>

</html>
